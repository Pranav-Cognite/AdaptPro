<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdaptPro — LLM wiki demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ea;
      --paper: #fffdf8;
      --ink: #1c1915;
      --muted: #5e584f;
      --line: #e2d9cc;
      --green: #1f6b45;
      --green-bg: #e5f4ec;
      --amber: #8a5a12;
      --amber-bg: #f8efdc;
      --accent: #243f73;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    header h1 { font-size: 20px; margin: 0; font-weight: 600; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; font-family: ui-sans-serif, system-ui, sans-serif; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button, .toggle {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: white;
      padding: 8px 14px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .pill {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 13px;
      font-weight: 650;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--green-bg);
      color: var(--green);
    }
    main { display: grid; grid-template-columns: 260px 1fr 340px; min-height: calc(100vh - 70px); }
    aside, section { min-height: 0; }
    nav { border-right: 1px solid var(--line); padding: 14px; }
    nav button.page {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-radius: 8px;
      background: transparent;
      padding: 8px 10px;
      margin-bottom: 2px;
    }
    nav button.page strong { display: block; font-size: 14px; }
    nav button.page span { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
    nav button.page.active { background: white; }
    article { padding: 28px 34px 80px; max-width: 820px; }
    article h2 { margin-top: 0; }
    pre {
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 17px;
      line-height: 1.45;
      margin: 0;
    }
    .query {
      border-left: 1px solid var(--line);
      padding: 16px;
      background: #fbf8f2;
    }
    .query h2 { font-size: 16px; margin: 0 0 10px; font-family: ui-sans-serif, system-ui, sans-serif; }
    textarea {
      width: 100%;
      min-height: 72px;
      font: 15px/1.4 ui-sans-serif, system-ui, sans-serif;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: white;
    }
    .scopes { display: flex; gap: 6px; margin: 10px 0; }
    .scopes button[aria-pressed="true"] { background: var(--ink); color: white; border-color: var(--ink); }
    .suggestions { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .suggestions button { text-align: left; border-radius: 10px; }
    .answer {
      margin-top: 14px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    .answer .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .excerpt { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    .excerpt b { color: var(--accent); }
    .empty { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .query, nav { border: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AdaptPro <span style="font-weight:400">· LLM wiki</span></h1>
      <p id="subtitle">Ask the graph · compiled wiki, no live model call · the Ready badge is the failure</p>
    </div>
    <div class="actions">
      <span id="pill" class="pill" hidden>Ready</span>
      <button id="ingest" class="primary">Ingest corpus</button>
      <button id="lint" disabled>Lint</button>
    </div>
  </header>
  <main>
    <nav id="pages"></nav>
    <article id="doc"><p class="empty">Ingest the eight source documents. The wiki will compile an overview and three persona pages.</p></article>
    <section class="query">
      <h2>Query</h2>
      <div class="suggestions" id="suggestions"></div>
      <textarea id="question" placeholder="Ask the wiki"></textarea>
      <div class="scopes">
        <button type="button" id="scope-overview" aria-pressed="true">Overview only</button>
        <button type="button" id="scope-all" aria-pressed="false">Every page</button>
      </div>
      <button id="ask" class="primary" disabled>Ask</button>
      <div id="answer"></div>
    </section>
  </main>
  <script>
    const questions = [
      "Are we ready to kick this off?",
      "Can the user create a work order from the answer?",
      "What does real-time mean?",
      "Did anyone flag demo tenants with missing file links?"
    ];
    let scope = "overview";
    let state = { ingested: false, pages: [] };

    const pagesEl = document.getElementById("pages");
    const docEl = document.getElementById("doc");
    const answerEl = document.getElementById("answer");
    const questionEl = document.getElementById("question");

    questions.forEach((text) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = text;
      button.addEventListener("click", () => {
        questionEl.value = text;
        ask();
      });
      document.getElementById("suggestions").appendChild(button);
    });

    document.getElementById("ingest").addEventListener("click", ingest);
    document.getElementById("lint").addEventListener("click", lint);
    document.getElementById("ask").addEventListener("click", ask);
    document.getElementById("scope-overview").addEventListener("click", () => setScope("overview"));
    document.getElementById("scope-all").addEventListener("click", () => setScope("all"));

    function setScope(next) {
      scope = next;
      document.getElementById("scope-overview").setAttribute("aria-pressed", String(next === "overview"));
      document.getElementById("scope-all").setAttribute("aria-pressed", String(next === "all"));
    }

    async function ingest() {
      const response = await fetch("/api/ingest", { method: "POST" });
      state = await response.json();
      render();
      showPage("overview");
    }

    async function lint() {
      const response = await fetch("/api/lint", { method: "POST" });
      const payload = await response.json();
      state = payload.state;
      render();
      showPage("lint");
    }

    async function ask() {
      const question = questionEl.value.trim();
      if (!question) return;
      const response = await fetch("/api/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, scope })
      });
      const payload = await response.json();
      answerEl.replaceChildren();
      if (payload.error) {
        answerEl.textContent = payload.error;
        return;
      }
      const box = document.createElement("div");
      box.className = "answer";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `Read ${payload.pages_read.join(", ")} · scope: ${payload.scope}`;
      const text = document.createElement("div");
      text.textContent = payload.answer;
      box.append(meta, text);
      payload.excerpts.forEach((excerpt) => {
        const row = document.createElement("div");
        row.className = "excerpt";
        const title = document.createElement("b");
        title.textContent = excerpt.title;
        row.append(title, document.createTextNode(" — " + excerpt.text));
        box.append(row);
      });
      answerEl.append(box);
    }

    function render() {
      const pill = document.getElementById("pill");
      const ingested = Boolean(state.ingested);
      document.getElementById("lint").disabled = !ingested;
      document.getElementById("ask").disabled = !ingested;
      document.getElementById("ingest").textContent = ingested ? `Ingest again (#${state.ingest_count + 1})` : "Ingest corpus";
      pill.hidden = !ingested;
      if (ingested) {
        pill.textContent = `${state.kickoff_status} · ${state.page_count} pages · ingest #${state.ingest_count}`;
        document.getElementById("subtitle").textContent =
          `${state.epic_title} · 8 sources compiled · query reads the overview first`;
      }
      pagesEl.replaceChildren();
      state.pages.forEach((page) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "page";
        button.dataset.slug = page.slug;
        const title = document.createElement("strong");
        title.textContent = page.title;
        const summary = document.createElement("span");
        summary.textContent = page.summary;
        button.append(title, summary);
        button.addEventListener("click", () => showPage(page.slug));
        pagesEl.append(button);
      });
    }

    function showPage(slug) {
      const page = state.pages.find((item) => item.slug === slug);
      if (!page) return;
      document.querySelectorAll("nav button.page").forEach((button) => {
        button.classList.toggle("active", button.dataset.slug === slug);
      });
      docEl.replaceChildren();
      const pre = document.createElement("pre");
      pre.textContent = page.body;
      docEl.append(pre);
    }
  </script>
</body>
</html>
