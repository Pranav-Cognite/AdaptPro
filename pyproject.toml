[project]
name = "adaptpro"
version = "0.1.0"
description = "Agentic alignment for Business, Product, and Tech — one epic, three languages, no false green."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "AdaptPro" }]
dependencies = [
    "pydantic>=2.9,<3",
]

[tool.poetry]
packages = [{ include = "adaptpro", from = "src" }]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
