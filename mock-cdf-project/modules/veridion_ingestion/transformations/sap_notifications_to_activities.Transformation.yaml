# Turns SAP PM maintenance notifications (RAW) into VeridionDowntimeActivity nodes. Converts SAP
# local times to UTC and classifies each notification as planned or unplanned.
externalId: tr_sap_notifications_to_activities
name: SAP PM notifications to downtime activities
dataSetExternalId: ds_veridion_sap_pm
destination:
  type: nodes
  view: { space: sp_veridion_dm, externalId: VeridionDowntimeActivity, version: v1 }
  instanceSpace: sp_veridion_demo
conflictMode: upsert
ignoreNullFields: false
isPublic: true
authentication:
  clientId: ${PIPELINE_RUNNER_CLIENT_ID}
  clientSecret: ${PIPELINE_RUNNER_CLIENT_SECRET}
  tokenUri: ${IDP_TOKEN_URL}
  cdfProjectName: ${CDF_PROJECT}
  scopes: ${IDP_SCOPES}
