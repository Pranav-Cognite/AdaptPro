# CogniteEquipment node instances for Line 3. Assets are functional locations (where
# something sits); equipment is the physical item installed there. The split follows the
# Core Data Model and matches SAP PM, where a functional location can outlive the equipment
# installed in it. Manufacturer names and serial numbers are fictional.

- space: sp_veridion_demo
  externalId: equip_r301
  sources:
    - source:
        space: cdf_cdm
        externalId: CogniteEquipment
        version: "v1"
        type: view
      properties:
        name: "Reactor R-301"
        description: "Equipment-master record for Reactor R-301."
        tags: [line-3]
        aliases: []
        source: { space: sp_veridion_demo, externalId: src_sap_pm_cv }
        sourceId: "EQ-BPV-19-0301"
        asset: { space: sp_veridion_demo, externalId: asset_reactor_r301 }
        equipmentType: { space: sp_veridion_demo, externalId: etype_reactor }
        manufacturer: "Brandt Process Vessels"
        serialNumber: "BPV-19-0301"
        files: []

