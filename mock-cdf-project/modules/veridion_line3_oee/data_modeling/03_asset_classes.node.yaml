# CogniteAssetClass nodes. Codes are Veridion's own short codes, not an external standard
# (`standard` is left null on purpose).

- space: sp_veridion_demo
  externalId: class_plant
  sources:
    - source:
        space: cdf_cdm
        externalId: CogniteAssetClass
        version: "v1"
        type: view
      properties:
        name: "Plant"
        description: "Veridion asset class: plant."
        code: "PLANT"
        standard: null

