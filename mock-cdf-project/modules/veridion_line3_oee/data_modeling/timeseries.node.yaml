# CogniteTimeSeries node instances. `assets` links a series to the CogniteAsset(s) it belongs
# to (assets.node.yaml). Datapoints are in ../timeseries/ (generated fixtures).
#
# OEE = Availability x Performance x Quality. ts_line3_oee_pct is the composite; the three
# component series are what "what's driving the loss" questions decompose into.
# ts_line3_oee_pct_mes_legacy is the number supervisors see today and is defined differently.
#
# `sourceUnit` is populated on every series; the `unit` relation to the Core Data Model unit
# catalogue is deliberately not mapped yet (see README, known gaps).

- space: sp_veridion_demo
  externalId: ts_line3_oee_pct
  sources:
    - source:
        space: cdf_cdm
        externalId: CogniteTimeSeries
        version: "v1"
        type: view
      properties:
        name: "Line 3 — OEE"
        description: "Overall Equipment Effectiveness for Production Line 3 (Availability x Performance x Quality)."
        tags: [oee, line-3]
        aliases: []
        source: { space: sp_veridion_demo, externalId: src_cdf_oee_function }
        sourceId: "fn_line3_oee_calc:oee"
        isStep: false
        type: "numeric"
        sourceUnit: "%"
        assets: [{ space: sp_veridion_demo, externalId: asset_line3 }]
        equipment: []
    - source:
        space: sp_veridion_dm
        externalId: VeridionTimeSeries
        version: "v1"
        type: view
      properties:
        signalRole: "oee"
        calcMethod: "Availability x Performance x Quality, per clock hour, SOP rev B"
        samplingSeconds: 3600
        definitionBasis: "sop-rev-b"
        knownIssues: "No value for hours with missing process data. Differs from the legacy MES OEE by definition, not by error."
        definitionDoc: { space: sp_veridion_demo, externalId: file_line3_oee_calculation_sop }

