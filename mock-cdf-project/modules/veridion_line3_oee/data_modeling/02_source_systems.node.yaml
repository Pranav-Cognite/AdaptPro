# CogniteSourceSystem nodes: where each instance's data came from. Assets, equipment,
# time series and activities point back to these through their `source` relation.

- space: sp_veridion_demo
  externalId: src_opcua_calder_dcs
  sources:
    - source:
        space: cdf_cdm
        externalId: CogniteSourceSystem
        version: "v1"
        type: view
      properties:
        name: "Calder Valley DCS/PLC (OPC UA)"
        description: "OPC UA servers on the Polymer Production Unit DCS and PLC network, read by the Cognite OPC UA Extractor."
        tags: [opcua, process]
        aliases: []
        version: "Plant OPC UA servers"
        manufacturer: null

