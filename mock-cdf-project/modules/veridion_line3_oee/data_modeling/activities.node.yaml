# CogniteActivity node instances — downtime events that drive the Availability component
# of Line 3's OEE. Note there is no CogniteEvent view in the Core Data Model;
# CogniteActivity is the correct concept, and it carries scheduling fields
# (CogniteSchedulable) instead of a single timestamp. VeridionDowntimeActivity adds the
# loss classification and SAP notification id.
#
# Things to know about this set (also listed in the project README):
#   * 2026-09-30: one stop appears twice (operator notification + maintenance notification).
#   * 2026-10-14: an unplanned stop whose SAP notification has no end time.
#   * Micro-stops under 10 minutes are not logged in SAP at all and appear only as output-rate dips.
#   * The two FV-301 stops (09-30 and 10-09) share a failure signature.

