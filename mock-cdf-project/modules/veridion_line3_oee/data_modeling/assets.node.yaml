# CogniteAsset node instances — Calder Valley Plant functional-location hierarchy.
# Each node is populated through two views: the Core Data Model CogniteAsset view, and
# VeridionAsset (modules/veridion_oee_model), which adds SAP functional location, OPC UA
# tag path, lifecycle status, criticality and commissioning year.
#
# Hierarchy (Line 3 shown in full; Lines 1, 2 and 4 are reactor + extruder only):
#   plant_caldervalley
#   ├── area_polymer_unit
#   │   ├── asset_line1 / asset_line2 / asset_line4  (reactor, extruder)
#   │   ├── asset_line3
#   │   │   ├── asset_reactor_r301     (FV-301, M-301, P-301A/B, HX-301, TT-301A/B, PT-301)
#   │   │   ├── asset_extruder_ex302   (M-302, GB-302, DH-302, SC-302, PT-302)
#   │   │   └── asset_pelletizer_pl303, asset_dryer_dr304, asset_packaging_pk305
#   │   └── asset_reactor_r301_dcs_legacy   (decommissioned duplicate of R-301 — see README)
#   ├── area_utilities
#   ├── area_packaging_warehouse
#   └── area_quality_lab

- space: sp_veridion_demo
  externalId: plant_caldervalley
  sources:
    - source:
        space: cdf_cdm
        externalId: CogniteAsset
        version: "v1"
        type: view
      properties:
        name: "Calder Valley Plant"
        description: "Veridion Chemicals specialty polymers manufacturing site."
        tags: [plant, chemical]
        aliases: [Calder Valley, CV]
        source: { space: sp_veridion_demo, externalId: src_sap_pm_cv }
        sourceId: "CV"
        assetClass: { space: sp_veridion_demo, externalId: class_plant }
        parent: null
    - source:
        space: sp_veridion_dm
        externalId: VeridionAsset
        version: "v1"
        type: view
      properties:
        sapFunctionalLocation: "CV"
        opcuaTagPath: null
        lifecycleStatus: "operating"
        criticality: "A"
        commissioningYear: 2011

