- space: sp_veridion_demo
  externalId: ts_reactor_r301_temperature_degc
  sources:
    - source:
        space: cdf_cdm
        externalId: CogniteTimeSeries
        version: "v1"
        type: view
      properties:
        name: Reactor R-301 — Temperature
        description: Reactor process temperature, a leading indicator for unplanned stops.
        tags: [temperature, reactor, line-3]
        aliases: []
        isStep: false
        type: numeric
        sourceUnit: degC
        assets: [{ space: sp_veridion_demo, externalId: asset_reactor_r301 }]
